services:
  mysql:
    image: mysql:8.4
    container_name: bytewatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      MYSQL_DATABASE: bytewatch
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bytewatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bytewatch-backend
    restart: on-failure
    # Waits for MySQL to actually accept connections, not just for the
    # container process to start — avoids the old "app crash-loops until
    # MySQL is ready" pattern.
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: JDBC
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bytewatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "8080:8080"
    networks:
      - bytewatch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytewatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - bytewatch-network

volumes:
  mysql-data:

networks:
  bytewatch-network:
  