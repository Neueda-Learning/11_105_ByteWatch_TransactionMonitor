server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresses text assets on the wire — a practical stand-in for
    # minification: most of the size win, none of the "now I have two
    # copies of app.js to keep in sync" maintenance cost.
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Route API calls through the frontend origin so browser clients
    # do not need backend host/IP-specific URLs.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}