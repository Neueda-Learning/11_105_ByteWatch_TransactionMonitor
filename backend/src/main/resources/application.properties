# --- Datasource: MySQL -------------------------------------------------
# Username/password are read from environment variables so real
# credentials never get committed to git. Set them before running:
#   macOS/Linux:  export DB_USERNAME=root  &&  export DB_PASSWORD=your_password
#   Windows (ps): $env:DB_USERNAME="root"  ;  $env:DB_PASSWORD="your_password"
# In IntelliJ: Run/Debug Configurations -> Environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/bytewatch?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema initialization ----------------------------------------------
# We're using plain JdbcTemplate (no JPA/Hibernate), so nothing will
# auto-create the tables. This tells Spring Boot to run schema.sql then
# data.sql on every startup.
spring.sql.init.mode=always

# --- Server ---------------------------------------------------------------
server.port=8080

spring.profiles.active=JDBC
spring.application.name=transactionmonitorapp