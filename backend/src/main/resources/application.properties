# --- Datasource: MySQL -------------------------------------------------
# Replace bytewatch / db_user / db_password with your actual database
# name and credentials. Create the database first: CREATE DATABASE bytewatch;
spring.datasource.url=jdbc:mysql://localhost:3306/bytewatch?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema initialization ----------------------------------------------
# We're using plain JdbcTemplate (no JPA/Hibernate), so nothing will
# auto-create the tables. This tells Spring Boot to run
# src/main/resources/schema.sql on every startup. Switch to "never"
# once the schema is stable and you don't want it re-run each time.
spring.sql.init.mode=always

# --- Server ---------------------------------------------------------------
server.port=8080

spring.profiles.active=JDBC
spring.application.name=transactionmonitorapp